services:
  web:
    environment:
      ASPNETCORE_URLS: 'http://+:5000'
      ConnectionStrings__DefaultConnection: 'Server=tcp:db,1433;Database=Cynosura.Template;User ID=sa;Password=Qwerty123!;MultipleActiveResultSets=false;TrustServerCertificate=true'
      IdentityServer__Clients__Cynosura.Template.Web.Ng__RedirectUri: 'http://localhost:5010/authentication/login-callback'
      IdentityServer__Clients__Cynosura.Template.Web.Ng__LogoutUri: 'http://localhost:5010/authentication/logout-callback'
      ASPNETCORE_ENVIRONMENT: Development
      Messaging__ConnectionUrl: 'rabbitmq://mq'
      Messaging__Username: 'Manager'
      Messaging__Password: 'Qwerty123!'
      UsingHttps: 'false'
      Cors__Origin: 'http://localhost:5010'
    ports:
      - '0.0.0.0:5000:5000'
    volumes:
      - 'dpkeys:/root/.aspnet/DataProtection-Keys'
  webng:
    ports:
      - '0.0.0.0:5010:80'
    volumes:
      - ./volumes/webng/config.json:/usr/share/nginx/html/assets/config.json
  worker:
    environment:
      ConnectionStrings__DefaultConnection: 'Server=tcp:db,1433;Database=Cynosura.Template;User ID=sa;Password=Qwerty123!;MultipleActiveResultSets=false;TrustServerCertificate=true'
      DOTNET_ENVIRONMENT: Development
      Messaging__ConnectionUrl: 'rabbitmq://mq'
      Messaging__Username: 'Manager'
      Messaging__Password: 'Qwerty123!'
  db:
    ports:
      - '0.0.0.0:1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'Qwerty123!'
    volumes:
      - db:/var/opt/mssql
  mq:
    environment:
      RABBITMQ_DEFAULT_USER: 'Manager'
      RABBITMQ_DEFAULT_PASS: 'Qwerty123!'
    ports:
      - '0.0.0.0:4369:4369'
      - '0.0.0.0:5672:5672'
      - '0.0.0.0:5671:5671'
      - '0.0.0.0:15672:15672'
      - '0.0.0.0:15671:15671'
    volumes:
      - mq:/var/lib/rabbitmq
volumes:
  db:
  mq:
  dpkeys:
